name: Release

# Wires check_release_consistency.py --tag to an actual tag push. Without this,
# nothing stops a tag being cut from an undated [Unreleased] changelog section,
# or from a tree whose project.version does not match the tag -- which is the
# drift that made 1.0.0 untaggable in the first place.
#
# Three jobs: build once, then fan out to PyPI and to a *draft* GitHub release.
# The draft is what makes the ordering safe -- the release is not announced
# until a human publishes it, so there is never a public release claiming a
# version PyPI does not have. Same shape as pallets/flask and urllib3.

on:
  push:
    tags:
      # Unprefixed, matching the 1.0.0 tag. A `v` prefix will not trigger this.
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

env:
  UV_VERSION: "0.11.28"
  DEFAULT_PYTHON: "3.13"

jobs:
  build:
    name: build and verify the artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Both are for attest-build-provenance. This job deliberately cannot
      # write to the repo or mint a token PyPI would accept.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # Published artifacts must not be built from a cache that an earlier
          # workflow run could have poisoned. Release builds are rare; a cold
          # resolve is the right trade.
          enable-cache: false

      # Runs before anything is built or published, so a mismatch fails the
      # release rather than shipping something mislabelled.
      - name: Tag must match project.version and a dated changelog section
        run: |
          uv run --no-project python .github/scripts/check_release_consistency.py \
            --tag "${GITHUB_REF_NAME}"

      - name: Build and verify the artifacts
        run: uv run --frozen --no-default-groups --group tox tox run -e build

      - name: Smoke-install the wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv --python "${DEFAULT_PYTHON}" /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import django_opensearch_models as m
          from django_opensearch_models.test import OSTestCase, is_os_online
          print("ok", m.__version__, OSTestCase.__name__, is_os_online.__name__)
          PY

      - name: Version reported by the wheel must match the tag
        run: |
          set -euo pipefail
          installed="$(/tmp/smoke/bin/python -c 'import django_opensearch_models as m; print(m.__version__)')"
          if [ "$installed" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::the built wheel reports $installed but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          mkdir -p release-notes
          uv run --no-project python - "${GITHUB_REF_NAME}" > release-notes/notes.md <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          # Everything between this version's heading and the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              sys.exit(f"no changelog section found for {version}")
          sys.stdout.write(match.group(1).strip() + "\n")
          PY

      # Handed to the two publish jobs rather than rebuilt in each: what reaches
      # PyPI is then byte-for-byte what was smoke-installed, attested, and
      # attached to the release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # A separate artifact, not a file inside dist/ -- anything in dist/ gets
      # uploaded to PyPI.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Trusted publishing (OIDC): PyPI is configured to accept a short-lived
    # token minted for this repository, this workflow file and the `pypi`
    # environment, so there is no long-lived API token to leak or rotate.
    # Renaming this file or the environment breaks the publish until the
    # trusted-publisher entry on PyPI is updated to match.
    environment:
      name: pypi
      url: https://pypi.org/p/django-opensearch-models
    permissions:
      # The only permission this job needs: it mints the OIDC token PyPI trusts.
      # It deliberately has no `contents` access and never checks the repo out,
      # so nothing from the tagged tree executes here.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: create the draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes/

      # Draft, so the release is not announced until someone has seen the `pypi`
      # job go green. Publishing it is the last manual step of a release; see
      # .claude/skills/release/SKILL.md.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes/notes.md
