name: Release

# Wires check_release_consistency.py --tag to an actual tag push. Without this,
# nothing stops a tag being cut from an undated [Unreleased] changelog section,
# or from a tree whose project.version does not match the tag.
#
# Build once, then fan out to PyPI, the documentation, and a *draft* GitHub
# release.
# The draft is what makes the ordering safe -- the release is not announced
# until a human publishes it, so there is never a public release claiming a
# version PyPI does not have. Same shape as pallets/flask and urllib3.

on:
  push:
    tags:
      # Tags are unprefixed. A `v` prefix will not trigger this workflow.
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

env:
  UV_VERSION: "0.11.28"
  DEFAULT_PYTHON: "3.13"

jobs:
  build:
    name: build and verify the artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Both are for attest-build-provenance. This job deliberately cannot
      # write to the repo or mint a token PyPI would accept.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # Published artifacts must not be built from a cache that an earlier
          # workflow run could have poisoned. Release builds are rare; a cold
          # resolve is the right trade.
          enable-cache: false

      # Runs before anything is built or published, so a mismatch fails the
      # release rather than shipping something mislabelled.
      - name: Tag must match project.version and a dated changelog section
        run: |
          uv run --no-project python .github/scripts/check_release_consistency.py \
            --tag "${GITHUB_REF_NAME}"

      - name: Build and verify the artifacts
        run: uv run --frozen --no-default-groups --group tox tox run -e build

      - name: Smoke-install the wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv --python "${DEFAULT_PYTHON}" /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import django_opensearch_models as m
          from django_opensearch_models.test import OSTestCase, is_os_online
          print("ok", m.__version__, OSTestCase.__name__, is_os_online.__name__)
          PY

      - name: Version reported by the wheel must match the tag
        run: |
          set -euo pipefail
          installed="$(/tmp/smoke/bin/python -c 'import django_opensearch_models as m; print(m.__version__)')"
          if [ "$installed" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::the built wheel reports $installed but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          mkdir -p release-notes
          uv run --no-project python - "${GITHUB_REF_NAME}" > release-notes/notes.md <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          # Everything between this version's heading and the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              sys.exit(f"no changelog section found for {version}")
          sys.stdout.write(match.group(1).strip() + "\n")
          PY

      # Handed to the two publish jobs rather than rebuilt in each: what reaches
      # PyPI is then byte-for-byte what was smoke-installed, attested, and
      # attached to the release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # A separate artifact, not a file inside dist/ -- anything in dist/ gets
      # uploaded to PyPI.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Trusted publishing (OIDC): PyPI is configured to accept a short-lived
    # token minted for this repository, this workflow file and the `pypi`
    # environment, so there is no long-lived API token to leak or rotate.
    # Renaming this file or the environment breaks the publish until the
    # trusted-publisher entry on PyPI is updated to match.
    environment:
      name: pypi
      url: https://pypi.org/p/django-opensearch-models
    permissions:
      # The only permission this job needs: it mints the OIDC token PyPI trusts.
      # It deliberately has no `contents` access and never checks the repo out,
      # so nothing from the tagged tree executes here.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: create the draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes/

      # Draft, so the release is not announced until someone has seen the `pypi`
      # job go green. Publishing it is the last manual step of a release; see
      # .claude/skills/release/SKILL.md.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes/notes.md

  docs:
    name: publish the documentation
    needs: pypi
    runs-on: ubuntu-24.04
    # Runs after the PyPI upload so the published documentation never describes
    # a version the index does not have. Read the Docs also builds on its own
    # webhook; doing it here as well makes the build part of the release, so a
    # documentation failure fails the release instead of going unnoticed.
    steps:
      - name: Build and activate this version on Read the Docs
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RTD_PROJECT: django-opensearch-models
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="https://readthedocs.org/api/v3/projects/${RTD_PROJECT}"
          auth="Authorization: Token ${RTD_TOKEN}"

          # The tag reaches Read the Docs through its own webhook, which may not
          # have fired yet when this job starts.
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "${api}/versions/${VERSION}/")"
            [ "$code" = "200" ] && break
            if [ "$attempt" = "30" ]; then
              echo "::error::Read the Docs does not know about version ${VERSION} after 5 minutes."
              echo "::error::Check that the repository webhook is connected."
              exit 1
            fi
            sleep 10
          done

          # A new tag is inactive until something activates it, and an inactive
          # version cannot be built.
          curl -fsS -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d '{"active": true, "hidden": false}' "${api}/versions/${VERSION}/" > /dev/null

          build_id="$(curl -fsS -X POST -H "$auth" "${api}/versions/${VERSION}/builds/" | jq -r '.build.id')"
          echo "Read the Docs build ${build_id} triggered for ${VERSION}"

          # Poll to completion: a triggered build that fails is still a failed
          # release, and nothing else would report it.
          for attempt in $(seq 1 60); do
            state="$(curl -fsS -H "$auth" "https://readthedocs.org/api/v3/builds/${build_id}/" | jq -r '.state')"
            if [ "$state" = "finished" ]; then
              success="$(curl -fsS -H "$auth" "https://readthedocs.org/api/v3/builds/${build_id}/" | jq -r '.success')"
              if [ "$success" = "true" ]; then
                echo "Documentation published: https://${RTD_PROJECT}.readthedocs.io/en/${VERSION}/"
                exit 0
              fi
              echo "::error::Read the Docs build ${build_id} failed. See https://readthedocs.org/projects/${RTD_PROJECT}/builds/${build_id}/"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Read the Docs build ${build_id} did not finish within 10 minutes."
          exit 1
