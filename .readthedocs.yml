# Read the Docs build configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# Schema v2 takes the interpreter under `build.tools`, not a top-level
# `python.version`. A config the schema rejects fails before sphinx ever runs.
version: 2

build:
  # Matched to ci.yml: same runner image, same DEFAULT_PYTHON, so a docs build
  # that is green in CI is green here.
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    # `method: uv` is native to Read the Docs and respects uv.lock, so the docs
    # build resolves the same pinned sphinx as `tox run -e docs` rather than a
    # second, separately drifting requirements file.
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/source/conf.py
  # Mirrors the -W in the docs tox env, so a warning cannot quietly degrade the
  # published site.
  fail_on_warning: true

# `formats: all` is deliberately not carried over. It never produced anything
# -- no build has ever succeeded -- and a latex failure on these long-unbuilt
# sources would fail the whole build. Add pdf/epub back deliberately once html
# is publishing.
