[tox]
requires =
    tox>=4.60
env_list =
    py{312,313,314,315}-dj{52,60,61}
skip_missing_interpreters = false

# Support matrix:
#   Django 5.2 -> Python 3.12, 3.13, 3.14, 3.15
#   Django 6.0 -> Python 3.12, 3.13, 3.14, 3.15
#   Django 6.1 -> Python 3.12, 3.13, 3.14, 3.15
# Django 6.x requires Python >=3.12, so once the project floor is >=3.12 the
# cross product contains no invalid cells and needs no exclusions.
#
# The OpenSearch *server* version is deliberately not a factor: it changes
# nothing about what tox installs, so an os219/os37 factor would double the env
# count while producing byte-identical environments. Which server was hit is
# recorded three other ways instead -- the COVERAGE_FILE name below, the CI job
# name, and runtests.py's check_cluster(), which fails the run outright if the
# cluster does not report the version named by $OPENSEARCH_SERVER.

[testenv]
description = Run the test suite on {env_name} against the cluster at $OPENSEARCH_URL
package = skip
allowlist_externals = uv
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
    UV_NO_MANAGED_PYTHON = 1
    COVERAGE_FILE = {tox_root}/.coverage.{env_name}.{env:OPENSEARCH_SERVER:noserver}
    PYTHONDEVMODE = 1
pass_env =
    CI
    GITHUB_*
    OPENSEARCH_URL
    OPENSEARCH_USERNAME
    OPENSEARCH_PASSWORD
    OPENSEARCH_VERIFY_CERTS
    OPENSEARCH_SERVER
    OPENSEARCH_REQUIRED
    PYTHONWARNINGS
commands_pre =
    uv sync --locked --no-default-groups --group test --python {env_python}
    dj52: uv pip install --python {env_python} "django>=5.2,<5.3"
    dj60: uv pip install --python {env_python} "django>=6.0,<6.1"
    dj61: uv pip install --python {env_python} "django>=6.1,<6.2"
commands =
    {env_python} -m coverage run runtests.py {posargs}
    {env_python} -m coverage run runtests.py --signal-processor celery {posargs}

[testenv:lowest]
description = Resolve every direct dependency to its declared floor and run the suite
base_python = python3.12
package = skip
allowlist_externals = uv
set_env =
    {[testenv]set_env}
    COVERAGE_FILE = {tox_root}/.coverage.lowest.{env:OPENSEARCH_SERVER:noserver}
pass_env = {[testenv]pass_env}
commands_pre =
    uv pip install --python {env_python} --resolution lowest-direct \
        --editable . "coverage>=7.10.4" "celery>=5.5.3" "pillow>=11.3.0"
commands = {[testenv]commands}

[testenv:coverage]
description = Combine coverage data from every env and report
# No base_python: this env runs on whatever interpreter tox itself is using,
# so it works on any supported Python. Pinning a minor here made CI fail --
# these jobs do not run actions/setup-python, so the runner only had 3.12.
package = skip
allowlist_externals = uv
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
    UV_NO_MANAGED_PYTHON = 1
commands_pre =
    uv sync --locked --no-default-groups --group test --python {env_python}
commands =
    {env_python} -m coverage combine
    {env_python} -m coverage report
    {env_python} -m coverage xml

[testenv:lint]
description = Run the ruff lint and format checks
# No base_python: this env runs on whatever interpreter tox itself is using,
# so it works on any supported Python. Pinning a minor here made CI fail --
# these jobs do not run actions/setup-python, so the runner only had 3.12.
package = skip
allowlist_externals = uv
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
    UV_NO_MANAGED_PYTHON = 1
commands_pre =
    uv sync --locked --no-default-groups --group lint --python {env_python}
commands =
    {env_python} -m ruff check --output-format={env:RUFF_OUTPUT_FORMAT:full} .
    {env_python} -m ruff format --check --diff .

[testenv:docs]
description = Build the Sphinx docs, warnings are errors
# No base_python: this env runs on whatever interpreter tox itself is using,
# so it works on any supported Python. Pinning a minor here made CI fail --
# these jobs do not run actions/setup-python, so the runner only had 3.12.
package = skip
allowlist_externals = uv
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
    UV_NO_MANAGED_PYTHON = 1
commands_pre =
    uv sync --locked --no-default-groups --group docs --python {env_python}
commands =
    {env_python} -m sphinx -W --keep-going -b html docs/source {tox_root}/docs/_build/html

[testenv:docs-serve]
description = Serve the docs on http://127.0.0.1:8000 and rebuild as files change
package = skip
allowlist_externals = uv
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
    UV_NO_MANAGED_PYTHON = 1
commands_pre =
    uv sync --locked --no-default-groups --group docs --python {env_python}
    # Not in the docs dependency group: Read the Docs installs that group, and a
    # live-reload server is of no use to it.
    uv pip install --python {env_python} sphinx-autobuild
commands =
    {env_python} -m sphinx_autobuild -W --keep-going -b html docs/source {tox_root}/docs/_build/html \
        --watch README.md

[testenv:docs-linkcheck]
description = Check every external link in the docs still resolves
package = skip
allowlist_externals = uv
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
    UV_NO_MANAGED_PYTHON = 1
commands_pre =
    uv sync --locked --no-default-groups --group docs --python {env_python}
commands =
    {env_python} -m sphinx -b linkcheck docs/source {tox_root}/docs/_build/linkcheck

[testenv:build]
description = Build the sdist and wheel, and assert the shipped subpackages survive
# No base_python: this env runs on whatever interpreter tox itself is using,
# so it works on any supported Python. Pinning a minor here made CI fail --
# these jobs do not run actions/setup-python, so the runner only had 3.12.
package = skip
allowlist_externals =
    uv
    uvx
    sh
# `uv build` adds to dist/ rather than replacing it, and every command below
# globs dist/ expecting exactly one wheel and one sdist. A leftover artifact
# from an older version makes `twine check` validate the wrong files and makes
# the `zipfile -l dist/*.whl` assertions fail with an argument error rather than
# a useful message. CI always starts with an empty dist/, so this only ever bit
# locally.
commands_pre =
    sh -c 'rm -rf {tox_root}/dist'
commands =
    uv build --out-dir {tox_root}/dist
    uvx twine check --strict {tox_root}/dist/*
    sh -c '{env_python} -m zipfile -l {tox_root}/dist/*.whl | grep -q "django_opensearch_models/test/testcases.py"'
    sh -c 'tar -tzf {tox_root}/dist/*.tar.gz | grep -q "django_opensearch_models/test/testcases.py"'
    sh -c 'tar -tzf {tox_root}/dist/*.tar.gz | grep -q "tests/test_integration.py"'
